site_name: Quantitative Finance Institute
site_description: A Chinese-first, reproducible knowledge base for quantitative finance mathematics.
site_url: https://ceyyy427.github.io/quantitative-finance-institute/
repo_url: https://github.com/ceyyy427/quantitative-finance-institute
repo_name: quantitative-finance-institute
strict: true

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换浅色模式
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 学习路线: syllabus.md
  - 基础:
      - 概率基础: 00-foundations/01-probability-basics.md
  - 术语表: glossary.md
