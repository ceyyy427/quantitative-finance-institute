site_name: Quantitative Finance Institute
site_description: A Chinese-first, reproducible knowledge base for quantitative finance mathematics.
site_url: https://ceyyy427.github.io/quantitative-finance-institute/
repo_url: https://github.com/ceyyy427/quantitative-finance-institute
repo_name: quantitative-finance-institute
strict: true

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换浅色模式
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 学习路线: syllabus.md
  - 学习路径: learning-paths.md
  - 知识地图: knowledge-map.md
  - 基础:
      - 概率基础: 00-foundations/01-probability-basics.md
  - 随机模型:
      - Brownian motion: 01-stochastic-processes/01-brownian-motion.md
  - 随机微积分:
      - Itô 引理: 02-stochastic-calculus/01-ito-lemma.md
  - 资产定价:
      - 二叉树与风险中性定价: 03-asset-pricing/01-binomial-risk-neutral.md
  - 衍生品:
      - Black–Scholes 公式: 05-derivatives/01-black-scholes.md
      - Greeks 与敏感度: 05-derivatives/02-greeks.md
      - Delta 对冲: 05-derivatives/03-delta-hedging.md
  - 数值方法:
      - Monte Carlo 定价: 06-numerical/01-monte-carlo-pricing.md
  - 组合与风险:
      - Markowitz 投资组合优化: 07-portfolio-risk/01-markowitz-optimization.md
      - VaR 与 CVaR: 07-portfolio-risk/02-var-cvar.md
  - 时间序列:
      - 金融时间序列与波动率: 08-time-series/01-financial-time-series.md
  - 计算机科学: 09-computer-science/index.md
  - 运筹学与组合优化: 10-operations-research/index.md
  - 机器学习与时间序列: 11-machine-learning/index.md
  - 策略研究:
      - 领域总览: 12-strategies/index.md
      - 研究工作流: 12-strategies/01-research-workflow.md
  - 综合实验:
      - 项目总览: 13-capstones/index.md
      - Black-Scholes 与对冲风险实验: 13-capstones/01-option-risk-lab.md
      - CVaR 组合优化实验: 13-capstones/02-cvar-portfolio-lab.md
  - 参考文献: references.md
  - 术语表: glossary.md
