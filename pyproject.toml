[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantitative-finance-institute"
version = "0.1.0"
description = "Reusable examples for the Quantitative Finance Institute knowledge base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "mkdocs-material>=9.5",
  "mkdocs>=1.6",
  "pytest>=8.0",
  "ruff>=0.6",
  "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
